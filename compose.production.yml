services:
  web:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:?Set APP_URL to the canonical public HTTPS origin}
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL to the canonical public HTTPS origin}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the production PostgreSQL connection string}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST for account email delivery}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER for account email delivery}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD for account email delivery}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM for account email delivery}
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
