services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: viralflow
      POSTGRES_USER: viralflow
      POSTGRES_PASSWORD: change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - viralflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viralflow -d viralflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  viralflow-postgres:
